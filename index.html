<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو الاحترافي</title>
    <!-- خطوط عصرية فاخرة -->
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #3d867c;
            --bg-body: #f4f6f8;
            --bg-surface: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #88929e;
            --border-color: #eaeef2;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Alexandria', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        
        /* ================= Admin Panel Styles ================= */
        #adminPanel {
            width: 400px; background: #fff; height: 100vh; overflow-y: auto;
            border-left: 1px solid var(--border-color); padding: 25px; box-shadow: var(--shadow-md);
            display: none; position: fixed; right: 0; top: 0; z-index: 1000;
        }
        #menuView { width: 100%; transition: 0.3s ease; }
        body.edit-mode #adminPanel { display: block; }
        body.edit-mode #menuView { width: calc(100% - 400px); margin-right: 400px; background: #e0e5ec; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* شكل الجوال في المعاينة */
        body.edit-mode .mobile-wrapper {
            width: 400px; height: 850px; background: var(--bg-surface); 
            border-radius: 40px; overflow: hidden; position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15), inset 0 0 0 12px #000;
            overflow-y: auto; border: 4px solid #333;
        }
        body.edit-mode .mobile-wrapper::-webkit-scrollbar { display: none; }

        .admin-section { background: #f8fafc; border: 1px solid var(--border-color); padding: 20px; margin-bottom: 20px; border-radius: var(--radius-md); }
        .admin-section h3 { font-size: 15px; margin-bottom: 15px; color: #333; font-weight: 600; display: flex; justify-content: space-between;}
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; margin-bottom: 6px; font-weight: 600; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: var(--primary-color); }
        
        .btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-add { background: #eff6ff; color: #3b82f6; width: 100%; margin-bottom: 10px; border: 1px dashed #3b82f6; }
        .btn-danger { background: #fef2f2; color: #ef4444; padding: 8px; border-radius: 6px; border: 1px solid #fee2e2;}
        .save-btn { background: #10b981; color: white; width: 100%; padding: 16px; font-size: 15px; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        
        .item-edit-card { background: #fff; padding: 15px; margin-bottom: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .addon-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; background: #f8fafc; padding: 8px; border-radius: 6px; }

        /* ================= Menu View (Premium UI) ================= */
        .preview-wrapper { width: 100%; max-width: 500px; margin: 0 auto; background: var(--bg-surface); min-height: 100vh; position: relative; padding-bottom: 50px; }
        
        /* Header & Cover */
        .header-container { position: relative; }
        .cover-img { width: 100%; height: 220px; object-fit: cover; }
        .top-icons { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; }
        .icon-btn { background: rgba(255,255,255,0.9); backdrop-filter: blur(4px); border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #333; box-shadow: var(--shadow-sm); font-size: 14px; }
        
        .brand-info { text-align: center; padding: 0 20px 20px; position: relative; margin-top: -45px; }
        .logo-img { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--bg-surface); object-fit: cover; background: #fff; box-shadow: var(--shadow-sm); margin: 0 auto 10px; }
        .brand-name { font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .brand-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; }
        .social-links { display: flex; justify-content: center; gap: 15px; }
        .social-links a { color: var(--text-muted); font-size: 18px; transition: 0.2s; }
        .social-links a:hover { color: var(--primary-color); }

        /* Navigation (Glassmorphism & Sticky) */
        .nav-wrapper { position: sticky; top: 0; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 100; border-bottom: 1px solid var(--border-color); }
        .nav-header-actions { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 0; }
        .nav-header-actions .search-box { color: var(--text-muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
        
        .category-nav { display: flex; overflow-x: auto; scroll-behavior: smooth; padding: 12px 20px; gap: 24px; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-link { white-space: nowrap; font-size: 14px; color: var(--text-muted); text-decoration: none; font-weight: 500; cursor: pointer; position: relative; padding-bottom: 8px; transition: 0.3s; }
        .cat-link.active { color: var(--primary-color); font-weight: 700; }
        .cat-link.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--primary-color); border-radius: 3px 3px 0 0; }

        /* Products List */
        .menu-container { padding: 20px; }
        .category-section { margin-bottom: 35px; scroll-margin-top: 110px; }
        .category-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        
        .product-card { display: flex; background: #fff; padding: 16px 0; border-bottom: 1px solid var(--border-color); transition: 0.2s; align-items: stretch; gap: 15px; }
        .product-card:last-child { border-bottom: none; }
        
        .product-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .product-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
        .product-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .product-meta { display: flex; align-items: center; gap: 12px; margin-top: auto; }
        .product-price { font-size: 14px; font-weight: 700; color: var(--primary-color); }
        .product-cal { font-size: 11px; color: #88929e; background: #f4f6f8; padding: 4px 8px; border-radius: 20px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        
        .product-img-wrapper { width: 90px; height: 90px; border-radius: var(--radius-md); overflow: hidden; flex-shrink: 0; box-shadow: var(--shadow-sm); }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Addons Tags */
        .addons-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .addon-tag { font-size: 10px; background: rgba(61, 134, 124, 0.08); color: var(--primary-color); padding: 4px 10px; border-radius: 20px; font-weight: 600; border: 1px solid rgba(61, 134, 124, 0.2); }

        /* Animation */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .product-card { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <!-- Admin Panel -->
    <aside id="adminPanel">
        <button class="btn save-btn" onclick="saveData()"><i class="fa-solid fa-cloud-arrow-up"></i> حفظ ونشر التغييرات</button>
        
        <div class="admin-section">
            <h3>الهوية والألوان <i class="fa-solid fa-palette text-muted"></i></h3>
            <div class="form-group"><label>اسم المحل</label><input type="text" id="edit-brand-name" oninput="updatePreview()"></div>
            <div class="form-group"><label>وصف قصير</label><input type="text" id="edit-brand-desc" oninput="updatePreview()"></div>
            <div class="form-group"><label>رابط الشعار (Logo)</label><input type="text" id="edit-logo" oninput="updatePreview()"></div>
            <div class="form-group"><label>رابط صورة الغلاف (Cover)</label><input type="text" id="edit-cover" oninput="updatePreview()"></div>
            <div class="form-group"><label>لون الهوية الرئيسي</label><input type="color" id="edit-color" style="height: 40px; padding: 2px;" oninput="updatePreview()"></div>
        </div>

        <div class="admin-section">
            <h3>التصنيفات (الأقسام) <i class="fa-solid fa-layer-group text-muted"></i></h3>
            <div id="admin-categories"></div>
            <button class="btn btn-add" onclick="addCategory()"><i class="fa-solid fa-plus"></i> إضافة قسم جديد</button>
        </div>

        <div class="admin-section">
            <h3>المنتجات (المنيو) <i class="fa-solid fa-mug-hot text-muted"></i></h3>
            <div id="admin-products"></div>
            <button class="btn btn-add" onclick="addProduct()"><i class="fa-solid fa-plus"></i> إضافة منتج جديد</button>
        </div>
    </aside>

    <!-- Client View & Live Preview -->
    <main id="menuView">
        <div id="previewWrapper" class="preview-wrapper">
            
            <div class="header-container">
                <div class="top-icons">
                    <button class="icon-btn"><i class="fa-solid fa-globe"></i></button>
                    <button class="icon-btn"><i class="fa-solid fa-share-nodes"></i></button>
                </div>
                <img id="view-cover" class="cover-img" src="" alt="Cover">
            </div>

            <div class="brand-info">
                <img id="view-logo" class="logo-img" src="" alt="Logo">
                <h1 id="view-brand-name" class="brand-name"></h1>
                <p id="view-brand-desc" class="brand-desc"></p>
                <div class="social-links">
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                    <a href="#"><i class="fa-solid fa-location-dot"></i></a>
                </div>
            </div>

            <!-- Sticky Navigation -->
            <div class="nav-wrapper">
                <div class="nav-header-actions">
                    <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i> بحث...</div>
                    <div style="color: var(--text-muted);"><i class="fa-solid fa-list-ul"></i></div>
                </div>
                <nav class="category-nav" id="view-nav"></nav>
            </div>

            <!-- Products Container -->
            <div class="menu-container" id="view-menu"></div>
            
        </div>
    </main>

    <script>
        // 1. البيانات الافتراضية
        const defaultData = {
            brandName: 'روستر للقهوة المختصة',
            brandDesc: 'نقدم أجود أنواع القهوة المختصة والحلويات المخبوزة يومياً بشغف.',
            logoUrl: 'https://images.unsplash.com/photo-1600093463592-8e36ae95ef56?auto=format&fit=crop&w=200&q=80',
            coverUrl: 'https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=800&q=80',
            primaryColor: '#3d867c',
            categories: [
                { id: 'cat1', name: 'القهوة المقطرة' },
                { id: 'cat2', name: 'قهوة ساخنة' },
                { id: 'cat3', name: 'المخبوزات' }
            ],
            products: [
                { id: 'p1', catId: 'cat1', name: 'اثيوبيا هاماشو', desc: 'ايحاءات التوت الأزرق، الشوكولاتة الداكنة، قوام ممتلئ وحمضية متزنة.', price: '23.00', cal: '5', img: 'https://images.unsplash.com/photo-1498804103079-a6351b050096?auto=format&fit=crop&w=200&q=80', addons: [] },
                { id: 'p2', catId: 'cat2', name: 'فلات وايت', desc: 'مزيج من الاسبريسو الغني مع الحليب المبخر بنعومة.', price: '18.00', cal: '120', img: '', addons: [ { name: 'حليب شوفان', price: '3', active: true }, { name: 'بدون سكر', price: '0', active: true } ] },
                { id: 'p3', catId: 'cat3', name: 'كرواسون لوز', desc: 'مخبوز طازج يومياً محشو بكريمة اللوز الغنية.', price: '16.00', cal: '340', img: 'https://images.unsplash.com/photo-1549903072-7e6e0bedb7fb?auto=format&fit=crop&w=200&q=80', addons: [] }
            ]
        };

        // 2. تهيئة الحالة
        let state = JSON.parse(localStorage.getItem('premiumMenuData')) || defaultData;
        const isEditMode = window.location.search.includes('?edit');

        if (isEditMode) {
            document.body.classList.add('edit-mode');
            document.getElementById('previewWrapper').classList.add('mobile-wrapper');
            initAdminForm();
        }

        // 3. رسم المنيو (واجهة العميل)
        function renderMenu() {
            document.documentElement.style.setProperty('--primary-color', state.primaryColor);
            
            // تحديث الألوان للشفافية
            const hex = state.primaryColor.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            document.documentElement.style.setProperty('--primary-light', `rgba(${r}, ${g}, ${b}, 0.08)`);
            document.documentElement.style.setProperty('--primary-border', `rgba(${r}, ${g}, ${b}, 0.2)`);

            document.getElementById('view-cover').src = state.coverUrl;
            document.getElementById('view-logo').src = state.logoUrl;
            document.getElementById('view-brand-name').textContent = state.brandName;
            document.getElementById('view-brand-desc').textContent = state.brandDesc;

            const nav = document.getElementById('view-nav');
            const menu = document.getElementById('view-menu');
            nav.innerHTML = '';
            menu.innerHTML = '';

            state.categories.forEach((cat, index) => {
                // شريط التصنيفات
                nav.innerHTML += `<a class="cat-link ${index === 0 ? 'active' : ''}" href="#${cat.id}">${cat.name}</a>`;
                
                // أقسام المنتجات
                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = cat.id;
                section.innerHTML = `<h2 class="category-title">${cat.name}</h2>`;
                
                const catProducts = state.products.filter(p => p.catId === cat.id);
                catProducts.forEach((prod, pIndex) => {
                    let addonsHtml = prod.addons.filter(a => a.active).map(a => 
                        `<span class="addon-tag" style="background: var(--primary-light); border-color: var(--primary-border);">${a.name} ${a.price > 0 ? '(+'+a.price+')' : ''}</span>`
                    ).join('');

                    section.innerHTML += `
                        <div class="product-card" style="animation-delay: ${pIndex * 0.1}s">
                            <div class="product-info">
                                <h3 class="product-name">${prod.name}</h3>
                                ${prod.desc ? `<p class="product-desc">${prod.desc}</p>` : ''}
                                <div class="product-meta">
                                    <span class="product-price">${prod.price} ر.س</span>
                                    ${prod.cal ? `<span class="product-cal"><i class="fa-solid fa-fire text-muted"></i> ${prod.cal} كالوري</span>` : ''}
                                </div>
                                ${addonsHtml ? `<div class="addons-list">${addonsHtml}</div>` : ''}
                            </div>
                            ${prod.img ? `<div class="product-img-wrapper"><img class="product-img" src="${prod.img}" alt="${prod.name}"></div>` : ''}
                        </div>
                    `;
                });
                menu.appendChild(section);
            });

            setupScrollSpy();
        }

        // 4. منطق لوحة التحكم
        function initAdminForm() {
            document.getElementById('edit-brand-name').value = state.brandName;
            document.getElementById('edit-brand-desc').value = state.brandDesc;
            document.getElementById('edit-logo').value = state.logoUrl;
            document.getElementById('edit-cover').value = state.coverUrl;
            document.getElementById('edit-color').value = state.primaryColor;
            
            renderAdminCategories();
            renderAdminProducts();
        }

        function updatePreview() {
            if(!isEditMode) return;
            state.brandName = document.getElementById('edit-brand-name').value;
            state.brandDesc = document.getElementById('edit-brand-desc').value;
            state.logoUrl = document.getElementById('edit-logo').value;
            state.coverUrl = document.getElementById('edit-cover').value;
            state.primaryColor = document.getElementById('edit-color').value;
            renderMenu();
        }

        // إدارة التصنيفات
        function renderAdminCategories() {
            const container = document.getElementById('admin-categories');
            container.innerHTML = state.categories.map((cat, i) => `
                <div class="addon-row">
                    <input type="text" value="${cat.name}" oninput="state.categories[${i}].name = this.value; renderMenu();" style="flex:1; border: 1px solid #ddd; padding: 8px; border-radius: 6px;">
                    <button class="btn btn-danger" onclick="removeCategory(${i})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
            renderAdminProducts(); 
        }
        function addCategory() {
            state.categories.push({ id: 'cat' + Date.now(), name: 'قسم جديد' });
            renderAdminCategories(); renderMenu();
        }
        function removeCategory(index) {
            state.categories.splice(index, 1);
            renderAdminCategories(); renderMenu();
        }

        // إدارة المنتجات
        function renderAdminProducts() {
            const container = document.getElementById('admin-products');
            
            container.innerHTML = state.products.map((prod, i) => {
                let addonsHtml = prod.addons.map((addon, j) => `
                    <div class="addon-row">
                        <input type="checkbox" ${addon.active ? 'checked' : ''} onchange="state.products[${i}].addons[${j}].active = this.checked; renderMenu();" title="تفعيل/إخفاء">
                        <input type="text" value="${addon.name}" placeholder="اسم الخيار" oninput="state.products[${i}].addons[${j}].name = this.value; renderMenu();" style="flex:2; border: 1px solid #ddd; padding: 6px; border-radius: 4px; font-size:11px;">
                        <input type="number" value="${addon.price}" placeholder="السعر" oninput="state.products[${i}].addons[${j}].price = this.value; renderMenu();" style="flex:1; border: 1px solid #ddd; padding: 6px; border-radius: 4px; font-size:11px;">
                        <button class="btn btn-danger" style="padding: 6px;" onclick="removeAddon(${i}, ${j})"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `).join('');

                return `
                <div class="item-edit-card">
                    <div class="form-group"><label>الاسم والتصنيف</label>
                        <div style="display:flex; gap:8px;">
                            <input type="text" placeholder="اسم المنتج" value="${prod.name}" oninput="state.products[${i}].name = this.value; renderMenu();" style="flex:2;">
                            <select onchange="state.products[${i}].catId = this.value; renderMenu();" style="flex:1;">
                                ${state.categories.map(c => `<option value="${c.id}" ${prod.catId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="form-group"><label>السعر والسعرات</label>
                        <div style="display:flex; gap:8px;">
                            <input type="number" placeholder="السعر (ر.س)" value="${prod.price}" oninput="state.products[${i}].price = this.value; renderMenu();">
                            <input type="number" placeholder="السعرات" value="${prod.cal}" oninput="state.products[${i}].cal = this.value; renderMenu();">
                        </div>
                    </div>
                    <div class="form-group"><label>صورة المنتج (رابط)</label><input type="text" placeholder="رابط الصورة (اتركه فارغاً لإخفاء الصورة)" value="${prod.img}" oninput="state.products[${i}].img = this.value; renderMenu();"></div>
                    <div class="form-group"><label>الوصف والمكونات</label><input type="text" placeholder="اكتب المكونات هنا" value="${prod.desc}" oninput="state.products[${i}].desc = this.value; renderMenu();"></div>
                    
                    <div style="margin-top:15px; background: #fafafa; padding: 10px; border-radius: 8px; border: 1px solid #eee;">
                        <label style="font-size:11px; font-weight:bold; display:block; margin-bottom:8px; color:#555;">الخيارات الإضافية (إضافات، أحجام..):</label>
                        ${addonsHtml}
                        <button class="btn btn-add" style="margin-top:5px; margin-bottom:0;" onclick="addAddon(${i})"><i class="fa-solid fa-plus"></i> إضافة خيار</button>
                    </div>
                    <button class="btn btn-danger" style="width:100%; margin-top:15px; background: #fff1f2; border: 1px solid #fecdd3; color: #e11d48;" onclick="removeProduct(${i})"><i class="fa-solid fa-trash"></i> حذف المنتج بالكامل</button>
                </div>
            `}).join('');
        }
        
        function addProduct() {
            if(state.categories.length === 0) return alert('أضف تصنيفاً واحداً على الأقل أولاً');
            state.products.unshift({ id: 'p' + Date.now(), catId: state.categories[0].id, name: 'منتج جديد', desc: '', price: '0', cal: '', img: '', addons: [] });
            renderAdminProducts(); renderMenu();
        }
        function removeProduct(index) {
            if(confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                state.products.splice(index, 1);
                renderAdminProducts(); renderMenu();
            }
        }
        function addAddon(prodIndex) {
            state.products[prodIndex].addons.push({ name: '', price: '0', active: true });
            renderAdminProducts(); renderMenu();
        }
        function removeAddon(prodIndex, addonIndex) {
            state.products[prodIndex].addons.splice(addonIndex, 1);
            renderAdminProducts(); renderMenu();
        }

        // 5. التمرير السلس (ScrollSpy)
        function setupScrollSpy() {
            const sections = document.querySelectorAll('.category-section');
            const navLinks = document.querySelectorAll('.cat-link');
            const navContainer = document.querySelector('.category-nav');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        navLinks.forEach(link => {
                            link.classList.remove('active');
                            if (link.getAttribute('href') === '#' + entry.target.id) {
                                link.classList.add('active');
                                navContainer.scrollLeft = link.offsetLeft - (navContainer.offsetWidth / 2) + (link.offsetWidth / 2);
                            }
                        });
                    }
                });
            }, { rootMargin: '-30% 0px -60% 0px' });

            sections.forEach(sec => observer.observe(sec));
        }

        // 6. حفظ البيانات
        function saveData() {
            localStorage.setItem('premiumMenuData', JSON.stringify(state));
            alert('تم حفظ التغييرات بنجاح! سيتم نقلك الآن لصفحة العميل.');
            window.location.href = window.location.pathname; // إزالة ?edit للعودة للعرض العادي
        }

        // التشغيل الأولي
        renderMenu();

    </script>
</body>
</html>
